{{- if .Values.postgresql.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seed-data
  labels:
    app.kubernetes.io/component: seed-job
    app.kubernetes.io/part-of: ccs
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/component: seed-job
        app.kubernetes.io/part-of: ccs
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - name: seed
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import asyncio
              from backend.database import init_db, ingest_from_csv
              async def main():
                  for attempt in range(20):
                      try:
                          await init_db()
                          break
                      except Exception as e:
                          if attempt < 19:
                                  print(f"DB not ready (attempt {attempt+1}/20): {e}")
                                  await asyncio.sleep(5)
                          else:
                                  raise
                  await ingest_from_csv()
                  print("Seed complete")
              asyncio.run(main())
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-backend-db-secret
          env:
            - name: DATABASE_URL
              value: >-
                postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
{{- end }}
