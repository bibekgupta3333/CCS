apiVersion: v2
name: ccs
description: CCS Realtime Injection Simulator — umbrella chart
type: application
version: 0.1.0
appVersion: "latest"

dependencies:
  - name: backend
    version: 0.1.0
    repository: file://charts/backend
  - name: frontend
    version: 0.1.0
    repository: file://charts/frontend
  - name: postgresql
    version: 18.7.2
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: ingress-nginx
    version: 4.15.1
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
